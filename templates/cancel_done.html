<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancellation Confirmed - Nam's Noodle Karaoke</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fb;
            color: #212529;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .success-card {
            max-width: 500px;
            margin: 100px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5e7eb;
            padding: 40px;
            text-align: center;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #d1e7dd;
            color: #0f5132;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-card">
            <div class="icon-circle">✓</div>
            {% if already_cancelled %}
            <h3 class="mb-2">Already Cancelled</h3>
            <p class="text-muted mb-4">This reservation has already been cancelled.</p>
            {% else %}
            <h3 class="mb-2">Cancellation Confirmed</h3>
            <p class="text-muted mb-4">Your reservation has been successfully cancelled. The staff has been notified.</p>
            {% endif %}
            <a href="/" class="btn btn-primary px-4 py-2" style="font-weight: 500;">Go to Website</a>
        </div>
    </div>
</body>
</html>
